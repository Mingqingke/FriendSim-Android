org.gradle.jvmargs=-Xmx1150m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.vfs.watch=false
android.useAndroidX=true
android.nonTransitiveRClass=true
# 设备端（aarch64 proot）构建：无 arm64 官方 aapt2，使用预置包装器
android.aapt2FromMavenOverride=/opt/android-tools/aapt2
android.suppressUnsupportedCompileSdk=37
kotlin.compiler.execution.strategy=in-process
android.builder.sdkDownload=false
# AGP 9 + 外置 Kotlin Gradle Plugin 的官方兼容开关
android.builtInKotlin=false
android.newDsl=false
systemProp.org.gradle.internal.http.connectionTimeout=20000
systemProp.org.gradle.internal.http.socketTimeout=20000
android.enableResourceOptimizations=false
